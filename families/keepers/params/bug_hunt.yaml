# Forest Keepers engine - episode 10: Bug Hunt (docs/engines/forest_keepers_bug_hunt.md), 16:9.
# A night walk along a forest path: Digs digs up an earthworm, the Keeper Field Guide comes out on its reading cart,
# and the Keepers find six bugs, each their own way (Digs digs, Hans rolls a log, Twigs peels bark, Wheels lifts a
# rock, Springs bounces up to a plant, Glo dims his light by the ferns). Every bug gets a close-up in Glo's lens,
# drawn in code to field-guide accuracy (bugs.py), is matched in the guide and gets its name card. End sign appended.
